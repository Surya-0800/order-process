<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picker Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 960px;
            margin-top: 40px;
        }
        #debug-output {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            padding: 10px;
            margin: 20px 0;
            white-space: pre-wrap;
            font-family: monospace;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>Picker Management</h1>
        
        <!-- Debug output area -->
        <div id="debug-output"></div>
        <button id="toggle-debug" class="btn btn-secondary mb-3">Show Debug Info</button>
        
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Pickers</h5>
                <button type="button" class="btn btn-primary" id="showAddModal">Add New Picker</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Picker ID</th>
                                <th>Name</th>
                                <th>Active</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="pickerTableBody">
                            <!-- Pickers will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Add Picker Modal -->
        <div class="modal fade" id="addPickerModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add New Picker</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addPickerForm">
                            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                            <div class="mb-3">
                                <label for="picker_id" class="form-label">Picker ID</label>
                                <input type="text" class="form-control" id="picker_id" required>
                            </div>
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="is_active" checked>
                                <label class="form-check-label" for="is_active">Active</label>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="savePickerBtn">Save</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Edit Picker Modal -->
        <div class="modal fade" id="editPickerModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Picker</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editPickerForm">
                            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                            <input type="hidden" id="edit_id">
                            <div class="mb-3">
                                <label for="edit_picker_id" class="form-label">Picker ID</label>
                                <input type="text" class="form-control" id="edit_picker_id" required>
                            </div>
                            <div class="mb-3">
                                <label for="edit_name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="edit_name" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="edit_is_active">
                                <label class="form-check-label" for="edit_is_active">Active</label>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="updatePickerBtn">Update</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Delete Confirmation Modal -->
        <div class="modal fade" id="deletePickerModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Confirm Delete</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>Are you sure you want to delete this picker?</p>
                        <p id="deletePickerName" class="fw-bold"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Debug utilities
        const debugOutput = document.getElementById('debug-output');
        const toggleDebugBtn = document.getElementById('toggle-debug');
        
        function debug(message, data = null) {
            const timestamp = new Date().toISOString().slice(11, 23);
            let logMessage = `[${timestamp}] ${message}`;
            
            if (data) {
                if (typeof data === 'object') {
                    logMessage += '\n' + JSON.stringify(data, null, 2);
                } else {
                    logMessage += '\n' + data;
                }
            }
            
            debugOutput.innerHTML += logMessage + '\n\n';
            console.log(message, data);
        }
        
        toggleDebugBtn.addEventListener('click', () => {
            if (debugOutput.style.display === 'none' || !debugOutput.style.display) {
                debugOutput.style.display = 'block';
                toggleDebugBtn.textContent = 'Hide Debug Info';
            } else {
                debugOutput.style.display = 'none';
                toggleDebugBtn.textContent = 'Show Debug Info';
            }
        });
        
        // API endpoint
        const API_URL = '/api/pickers/';
        
        // DOM elements
        const pickerTableBody = document.getElementById('pickerTableBody');
        const addPickerModal = new bootstrap.Modal(document.getElementById('addPickerModal'));
        const editPickerModal = new bootstrap.Modal(document.getElementById('editPickerModal'));
        const deletePickerModal = new bootstrap.Modal(document.getElementById('deletePickerModal'));
        
        // Get CSRF token
        function getCSRFToken() {
            const token = document.querySelector('[name=csrfmiddlewaretoken]').value;
            debug('Retrieved CSRF token', token);
            return token;
        }
        
        // Load all pickers
        function loadPickers() {
            debug('Loading pickers...');
            fetch(API_URL)
                .then(response => {
                    debug(`Received response: ${response.status} ${response.statusText}`);
                    return response.json();
                })
                .then(data => {
                    debug('Pickers loaded successfully', data);
                    renderPickers(data);
                })
                .catch(error => {
                    debug('Error loading pickers', error.toString());
                    console.error('Error loading pickers:', error);
                });
        }
        
        // Render pickers to table
        function renderPickers(pickers) {
            debug('Rendering pickers', pickers);
            pickerTableBody.innerHTML = '';
            
            if (pickers.length === 0) {
                pickerTableBody.innerHTML = '<tr><td colspan="4" class="text-center">No pickers found</td></tr>';
                return;
            }
            
            pickers.forEach(picker => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${picker.picker_id}</td>
                    <td>${picker.name}</td>
                    <td>${picker.is_active ? 'Yes' : 'No'}</td>
                    <td>
                        <button class="btn btn-sm btn-info edit-btn" data-id="${picker.id}">Edit</button>
                        <button class="btn btn-sm btn-danger delete-btn" data-id="${picker.id}" data-name="${picker.name}">Delete</button>
                        <button class="btn btn-sm btn-${picker.is_active ? 'warning' : 'success'} toggle-btn" data-id="${picker.id}">
                            ${picker.is_active ? 'Deactivate' : 'Activate'}
                        </button>
                    </td>
                `;
                pickerTableBody.appendChild(row);
            });
            
            // Add event listeners
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => editPicker(btn.dataset.id));
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('deletePickerName').textContent = btn.dataset.name;
                    document.getElementById('confirmDeleteBtn').dataset.id = btn.dataset.id;
                    deletePickerModal.show();
                });
            });
            
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.addEventListener('click', () => togglePickerActive(btn.dataset.id));
            });
        }
        
        // Add new picker
        function addPicker() {
            const picker = {
                picker_id: document.getElementById('picker_id').value,
                name: document.getElementById('name').value,
                is_active: document.getElementById('is_active').checked
            };
            
            debug('Attempting to add new picker', picker);
            
            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()
                },
                body: JSON.stringify(picker)
            })
            .then(response => {
                debug(`Received response: ${response.status} ${response.statusText}`);
                if (!response.ok) {
                    return response.json().then(data => {
                        debug('Error details:', data);
                        throw new Error(JSON.stringify(data));
                    });
                }
                return response.json();
            })
            .then(data => {
                debug('Picker added successfully', data);
                addPickerModal.hide();
                document.getElementById('addPickerForm').reset();
                loadPickers();
            })
            .catch(error => {
                debug('Error adding picker', error.toString());
                try {
                    const errorData = JSON.parse(error.message);
                    let errorMessage = 'Failed to add picker:\n';
                    for (const key in errorData) {
                        errorMessage += `${key}: ${errorData[key]}\n`;
                    }
                    alert(errorMessage);
                } catch (e) {
                    alert('Failed to add picker. Check the debug output for details.');
                }
            });
        }
        
        // Edit picker
        function editPicker(id) {
            debug(`Loading picker ID ${id} for editing`);
            fetch(`${API_URL}${id}/`)
                .then(response => {
                    debug(`Received response: ${response.status} ${response.statusText}`);
                    return response.json();
                })
                .then(picker => {
                    debug('Picker details loaded for editing', picker);
                    document.getElementById('edit_id').value = picker.id;
                    document.getElementById('edit_picker_id').value = picker.picker_id;
                    document.getElementById('edit_name').value = picker.name;
                    document.getElementById('edit_is_active').checked = picker.is_active;
                    editPickerModal.show();
                })
                .catch(error => {
                    debug('Error fetching picker details', error.toString());
                    alert('Failed to load picker details. Check the debug output.');
                });
        }
        
        // Update picker
        function updatePicker() {
            const id = document.getElementById('edit_id').value;
            const picker = {
                picker_id: document.getElementById('edit_picker_id').value,
                name: document.getElementById('edit_name').value,
                is_active: document.getElementById('edit_is_active').checked
            };
            
            debug(`Updating picker ID ${id}`, picker);
            
            fetch(`${API_URL}${id}/`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()
                },
                body: JSON.stringify(picker)
            })
            .then(response => {
                debug(`Received response: ${response.status} ${response.statusText}`);
                if (!response.ok) {
                    return response.json().then(data => {
                        debug('Error details:', data);
                        throw new Error(JSON.stringify(data));
                    });
                }
                return response.json();
            })
            .then(data => {
                debug('Picker updated successfully', data);
                editPickerModal.hide();
                loadPickers();
            })
            .catch(error => {
                debug('Error updating picker', error.toString());
                try {
                    const errorData = JSON.parse(error.message);
                    let errorMessage = 'Failed to update picker:\n';
                    for (const key in errorData) {
                        errorMessage += `${key}: ${errorData[key]}\n`;
                    }
                    alert(errorMessage);
                } catch (e) {
                    alert('Failed to update picker. Check the debug output for details.');
                }
            });
        }
        
        // Delete picker
        function deletePicker(id) {
            debug(`Deleting picker ID ${id}`);
            fetch(`${API_URL}${id}/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': getCSRFToken()
                }
            })
            .then(response => {
                debug(`Received response: ${response.status} ${response.statusText}`);
                if (!response.ok) {
                    throw new Error(`Delete request failed with status ${response.status}`);
                }
                debug('Picker deleted successfully');
                deletePickerModal.hide();
                loadPickers();
            })
            .catch(error => {
                debug('Error deleting picker', error.toString());
                alert('Failed to delete picker. Check the debug output.');
            });
        }
        
        // Toggle picker active status
        function togglePickerActive(id) {
            debug(`Toggling active status for picker ID ${id}`);
            fetch(`${API_URL}${id}/toggle_active/`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken()
                }
            })
            .then(response => {
                debug(`Received response: ${response.status} ${response.statusText}`);
                if (!response.ok) {
                    throw new Error(`Toggle request failed with status ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                debug('Picker active status toggled successfully', data);
                loadPickers();
            })
            .catch(error => {
                debug('Error toggling picker status', error.toString());
                alert('Failed to update picker status. Check the debug output.');
            });
        }
        
        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            debug('Page loaded, initializing...');
            
            try {
                // Load pickers on page load
                loadPickers();
                
                // Show add picker modal
                document.getElementById('showAddModal').addEventListener('click', () => {
                    debug('Add new picker button clicked');
                    document.getElementById('addPickerForm').reset();
                    addPickerModal.show();
                });
                
                // Save new picker
                document.getElementById('savePickerBtn').addEventListener('click', () => {
                    debug('Save button clicked');
                    addPicker();
                });
                
                // Update picker
                document.getElementById('updatePickerBtn').addEventListener('click', () => {
                    debug('Update button clicked');
                    updatePicker();
                });
                
                // Confirm delete
                document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
                    debug(`Delete confirmed for ID ${this.dataset.id}`);
                    deletePicker(this.dataset.id);
                });
                
                debug('All event listeners initialized successfully');
            } catch (error) {
                debug('Error during initialization', error.toString());
            }
        });
    </script>
</body>
</html>
