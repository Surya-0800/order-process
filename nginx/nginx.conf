server {
    listen 80;
    server_name _;
    
    # Static files
    location /static/ {
        alias /home/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # Media files
    location /media/ {
        alias /home/app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # Proxy to Django
    location / {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeout settings - UPDATED
    proxy_connect_timeout 1000s;    # Was 75s
    proxy_send_timeout 1000s;       # NEW - prevents write timeouts
    proxy_read_timeout 1000s;       # Was 300s - THIS WAS YOUR PROBLEM
    send_timeout 1000s;             # NEW - client send timeout
    
    # File upload size - UPDATED
    client_max_body_size 100M;      # Was 20M - increase for larger PDFs
    client_body_timeout 1000s;      # NEW - timeout for receiving request body
}
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
}